name: Quickdress
options:
  bundleIdPrefix: edu.aucegypt.quickdress
  deploymentTarget:
    iOS: "17.0"
packages:
  QuickdressCore:
    path: QuickdressCore
  StoragePlugins:
    path: StoragePlugins
  CapturePlugins:
    path: CapturePlugins
targets:
  Quickdress:
    type: application
    platform: iOS
    sources:
      - Quickdress
    dependencies:
      - package: QuickdressCore
      - package: StoragePlugins
      - package: CapturePlugins
    scheme:
      testTargets:
        - QuickdressTests
        - QuickdressUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.aucegypt.quickdress
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Quickdress
        INFOPLIST_KEY_NSCameraUsageDescription: "Quickdress uses the camera to photograph your clothes. Photos stay on this iPhone."
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
  QuickdressTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - QuickdressTests
    dependencies:
      - target: Quickdress
      - package: QuickdressCore
      - package: CapturePlugins
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
  QuickdressUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - QuickdressUITests
    dependencies:
      - target: Quickdress
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
        TEST_TARGET_NAME: Quickdress
